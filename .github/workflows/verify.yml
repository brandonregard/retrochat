name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Tcl lint
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install tclint
        run: python -m pip install tclint==0.9.0

      - name: Lint Tcl sources
        run: tclint --ignore command-args .

  protocol:
    name: Protocol — ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Tcl on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes tcl

      - name: Install Tcl on macOS
        if: runner.os == 'macOS'
        run: brew install tcl-tk

      - name: Run protocol tests on Unix
        if: runner.os != 'Windows'
        run: tclsh tests/protocol.test

      - name: Run relay tests on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tclsh server.tcl 17777 >server.log 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          for attempt in 1 2 3 4 5; do
            if tclsh tests/relay.test 17777; then
              exit 0
            fi

            sleep 1
          done

          echo "Relay test failed. Server output:"
          cat server.log
          exit 1

      - name: Install and test Tcl on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install magicsplat-tcl-tk --yes --no-progress

          $tclsh = Get-Command tclsh*.exe -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $tclsh) {
            $roots = @(
              "C:\Program Files",
              "C:\Program Files (x86)",
              "C:\Tcl",
              "C:\tools",
              $env:ChocolateyInstall
            ) | Where-Object {
              $_ -and (Test-Path $_)
            }

            $tclsh = Get-ChildItem `
              -Path $roots `
              -Filter "tclsh*.exe" `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          if (-not $tclsh) {
            throw "No Tcl interpreter found after installing Magicsplat Tcl/Tk"
          }

          $executable = if ($tclsh.Source) {
            $tclsh.Source
          } else {
            $tclsh.FullName
          }

          Write-Host "Using Tcl interpreter: $executable"

          & $executable tests/protocol.test

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $server = Start-Process `
            -FilePath $executable `
            -ArgumentList "server.tcl", "17777" `
            -PassThru `
            -NoNewWindow

          try {
            $passed = $false

            for ($attempt = 1; $attempt -le 5; $attempt++) {
              & $executable tests/relay.test 17777

              if ($LASTEXITCODE -eq 0) {
                $passed = $true
                break
              }

              Start-Sleep -Seconds 1
            }

            if (-not $passed) {
              throw "Relay test failed after five attempts"
            }
          } finally {
            Stop-Process `
              -Id $server.Id `
              -Force `
              -ErrorAction SilentlyContinue
          }